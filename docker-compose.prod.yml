services:
  postgres:
    ports: []

  redis:
    ports: []

  backend:
    ports: []
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DEMO_DATA_ENABLED: "false"
      AUTH_COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the exact HTTPS web origin}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS to the API and edge hostnames}

  frontend:
    ports: []

  https:
    depends_on:
      frontend:
        condition: service_healthy
